<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta
      name="description"
      content="A generative field of abstract and animal-like procedural light drawn with p5.js."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23050505%22/><path d=%22M12 37C24 10 35 54 52 23%22 fill=%22none%22 stroke=%22%23f4eee2%22 stroke-width=%223%22 stroke-linecap=%22round%22/></svg>"
    />
    <title>Drift Index — Generative Field</title>
  </head>
  <body>
    <main class="experience" aria-label="Generative procedural artwork">
      <div id="sketch" aria-hidden="true"></div>

      <a
        class="github-link"
        href="https://github.com/kyrie25"
        target="_blank"
        rel="noreferrer"
        aria-label="GitHub profile for kyrie25"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
          />
        </svg>
        <span aria-hidden="true">/ kyrie25</span>
      </a>

      <section class="instructions" aria-label="Controls">
        <p>Click or tap to re-form</p>
      </section>

      <div class="edition" aria-live="polite" aria-atomic="true">
        <span class="edition__label">Current form</span>
        <span id="family-label" class="edition__family">plume</span>
        <span id="color-label" class="edition__color">tide / solid</span>
        <span id="seed-label" class="edition__value">000000</span>
      </div>

      <button
        id="motion-toggle"
        class="motion-toggle"
        type="button"
        aria-pressed="false"
      >
        <span class="motion-toggle__dot" aria-hidden="true"></span>
        <span id="motion-label">Reduced motion / off</span>
      </button>

      <div class="corner corner--top" aria-hidden="true"></div>
      <div class="corner corner--bottom" aria-hidden="true"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
